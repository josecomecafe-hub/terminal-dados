name: Atualizar dados CVM

on:
  schedule:
    - cron: "0 9 * * 1"     # toda segunda, 06:00 (Brasília)
  workflow_dispatch:         # botão "Run workflow" manual

permissions:
  contents: write

concurrency:
  group: cvm-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar JSON da CVM
        run: python scripts/build_cvm.py
      - name: Gerar fundos e FIIs
        run: python scripts/build_fundos.py
        continue-on-error: true      # se a CVM falhar aqui, os balanços ainda são publicados
      - name: Publicar se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "dados CVM $(date -u +%F)"
            git push
          fi
